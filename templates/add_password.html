{% extends "base.html" %}

{% block content %}

<h1>Add Credential</h1>

{% if generated_password %}

<div class="generated-password">

    <label>Generated Password</label>

    <input
        type="text"
        value="{{ generated_password }}"
        readonly
    >

    <p>
        Copy this password into the password field below.
    </p>

</div>

{% endif %}


<form method="POST" action="{{ url_for('add_credential') }}">

    <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
    >

    <label>Service Name</label>

    <input
        type="text"
        name="service_name"
        required
    >


    <label>Username</label>

    <input
        type="text"
        name="username"
        required
    >


    <label>Password</label>

    <input
        type="password"
        name="password"
        value="{{ generated_password or '' }}"
        required
    >


    <label>Website URL</label>

    <input
        type="url"
        name="website_url"
    >


    <button type="submit">
        Save Credential
    </button>

</form>

{% endblock %}
